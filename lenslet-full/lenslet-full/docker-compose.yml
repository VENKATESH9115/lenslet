services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: lenslet, POSTGRES_PASSWORD: lenslet, POSTGRES_DB: lenslet }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U lenslet"], interval: 3s, retries: 20 }
  api:
    build: ./backend
    env_file: .env
    environment: { DATABASE_URL: "postgresql://lenslet:lenslet@db:5432/lenslet" }
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    volumes: ["./frontend:/app/frontend:ro"]
volumes: { pgdata: {} }
