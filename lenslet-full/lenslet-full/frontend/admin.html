<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/app.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>Owner dashboard – Lenslet</title><meta name="robots" content="noindex"></head>
<body class="in-app"><header id="hd"></header>
<main class="wrap pg"><h1>Owner dashboard</h1>
<div class="tabs" role="tablist" id="tabs"><button role="tab" data-t="ov" aria-selected="true">Overview</button><button role="tab" data-t="bk" aria-selected="false">Bookings</button><button role="tab" data-t="inv" aria-selected="false">Inventory</button><button role="tab" data-t="cu" aria-selected="false">Customers and ID</button></div>
<section id="p"></section></main>
<dialog id="dlg"><button class="x" id="cl" aria-label="Close">✕</button><div class="dmain" id="dm"></div></dialog>
<script type="module" src="/js/shell.js"></script>
<script type="module">
import {api,inr,me,esc,fdt,label,toast} from '/js/api.js';
const $=s=>document.querySelector(s),dlg=$('#dlg');let tab='ov',filter='';
$('#cl').onclick=()=>dlg.close();
const u=await me();if(!u||u.role!=='admin'){location.href=u?'/account.html':'/login.html?next=/admin.html'}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));show()};
const fail=x=>toast(x.message,true);
async function show(){$('#p').innerHTML='<div class="sk-l"></div>';try{await({ov,bk,inv,cu}[tab])()}catch(x){$('#p').innerHTML=`<div class="empty"><h3>Could not load this view</h3><p>${esc(x.message)}</p></div>`}}
async function ov(){const s=await api('/admin/stats'),mx=Math.max(1,...s.revenue_by_day.map(d=>+d.amount));
 const c=[['Today\'s bookings',s.today_bookings],['Active rentals',s.active_rentals],['Today\'s returns',s.today_returns],['Pending payment',s.pending_requests],['Revenue, 30 days',inr(s.revenue_30d)],['Deposits held',inr(s.deposits_held)]];
 $('#p').innerHTML=`<div class="cards">${c.map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
 <h2 style="font-size:22px;margin:24px 0 12px">Revenue, last 14 days</h2><div class="chart" role="img" aria-label="Revenue by day">${s.revenue_by_day.map(d=>`<i title="${d.day}: ${inr(+d.amount)}" style="height:${Math.max(3,+d.amount/mx*100)}%"></i>`).join('')}</div>
 <div class="two" style="margin-top:24px"><div><h2 style="font-size:22px;margin-bottom:12px">Popular equipment</h2>${s.popular.map(p=>`<div class="row"><span>${esc(p.name)}</span><b>${p.n} bookings</b></div>`).join('')||'<p style="color:var(--mut)">No bookings yet.</p>'}</div>
 <div><h2 style="font-size:22px;margin-bottom:12px">Upcoming returns</h2>${s.upcoming_returns.map(r=>`<div class="row"><span>${r.code}</span><b>${fdt(r.end_at)}</b></div>`).join('')||'<p style="color:var(--mut)">Nothing out on rent.</p>'}
 ${s.refunds_pending.length?`<h2 style="font-size:22px;margin:20px 0 8px">Refunds to process</h2>${s.refunds_pending.map(r=>`<div class="row"><span>${r.code}</span><b>Cancelled and paid</b></div>`).join('')}`:''}</div></div>`}
async function bk(){const b=await api('/admin/bookings'+(filter?'?status='+filter:''));
 const sts=['','PAYMENT_PENDING','CONFIRMED','READY_FOR_PICKUP','RENTED','RETURN_PENDING','RETURNED','INSPECTION','COMPLETED','CANCELLED'];
 $('#p').innerHTML=`<label class="fld" style="max-width:240px;margin-bottom:14px">Status<select id="fs">${sts.map(s=>`<option value="${s}" ${s===filter?'selected':''}>${s?label(s):'All bookings'}</option>`).join('')}</select></label>
 ${b.length?`<div class="tw"><table class="tbl"><thead><tr><th>Booking</th><th>Customer</th><th>Gear and dates</th><th>Amount</th><th>Actions</th></tr></thead><tbody>${b.map(x=>`<tr><td><b>${x.code}</b><br><span class="status ${x.status}">${label(x.status)}</span></td>
 <td>${esc(x.customer)}<br><span style="color:var(--mut)">${esc(x.customer_email)}</span><br>ID: ${x.kyc_status?label(x.kyc_status):'not added'}</td>
 <td>${x.items.map(i=>esc(i.name)).join(', ')}<br><span style="color:var(--mut)">${fdt(x.start_at)} to ${fdt(x.end_at)} · ${x.fulfilment==='pickup'?'Pickup':esc(x.address?.line1||'')+', '+esc(x.address?.city||'')}</span></td>
 <td>${inr(x.total)}<br><span style="color:var(--mut)">${x.paid?'Paid':'Unpaid'}${x.refunded?' · Refunded '+inr(x.refunded):''}</span></td>
 <td><div class="acts">${x.status==='PAYMENT_PENDING'?`<button class="btn p sm" data-pay="${x.id}">Record payment</button>`:''}
 ${x.next.filter(n=>n!=='CANCELLED'||true).map(n=>`<button class="btn sm ${n==='CANCELLED'?'':'p'}" data-mv="${x.id}:${n}">${n==='CANCELLED'?'Cancel':'Mark '+label(n).toLowerCase()}</button>`).join('')}
 ${['RETURNED','INSPECTION'].includes(x.status)?`<button class="btn sm" data-ins="${x.id}">Inspect return</button>`:''}
 ${x.status==='CANCELLED'&&x.paid&&!x.refunded?`<button class="btn sm" data-rf="${x.id}:${x.total}">Refund</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>No bookings here</h3><p>New bookings appear as customers reserve gear.</p></div>'}`;
 $('#fs').onchange=e=>{filter=e.target.value;show()}}
$('#p').addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
 try{
  if(t.dataset.mv){const[id,to]=t.dataset.mv.split(':');if(to==='CANCELLED'&&!confirm('Cancel this booking and release the gear?'))return;await api(`/admin/bookings/${id}/transition`,{method:'POST',body:{to}});toast('Updated.');show()}
  else if(t.dataset.pay){$('#dm').innerHTML=`<h2>Record payment</h2><p>Use this for cash, UPI or card taken at the counter.</p><label class="fld">Method<select id="pm"><option value="upi">UPI</option><option value="cash">Cash</option><option value="card_at_counter">Card at counter</option><option value="bank_transfer">Bank transfer</option></select></label><button class="btn p" id="ok">Confirm payment received</button>`;dlg.showModal();
   $('#ok').onclick=async()=>{try{await api(`/admin/bookings/${t.dataset.pay}/record-payment`,{method:'POST',body:{method:$('#pm').value}});dlg.close();toast('Payment recorded. Booking confirmed.');show()}catch(x){fail(x)}}}
  else if(t.dataset.ins){const id=t.dataset.ins;$('#dm').innerHTML=`<h2>Return inspection</h2><div class="two"><label class="fld">Condition before<input id="i1" value="excellent"></label><label class="fld">Condition after<input id="i2" value="excellent"></label></div><label class="fld">Damage (leave empty if none)<input id="i3"></label><label class="fld">Missing accessories<input id="i4"></label><div class="two"><label class="fld">Late by (hours)<input id="i5" type="number" min="0" value="0"></label><label class="fld">Extra charges (₹)<input id="i6" type="number" min="0" value="0"></label></div><label class="fld">Deposit deductions (₹)<input id="i7" type="number" min="0" value="0"></label><p class="note" style="text-align:left">Damaged or incomplete gear moves to maintenance automatically.</p><button class="btn p" id="ok">Save inspection</button>`;dlg.showModal();
   $('#ok').onclick=async()=>{try{const r=await api(`/admin/bookings/${id}/inspection`,{method:'POST',body:{condition_before:$('#i1').value,condition_after:$('#i2').value,damage:$('#i3').value,missing_items:$('#i4').value,late_hours:+$('#i5').value||0,extra_charges:Math.round(+$('#i6').value*100)||0,deposit_deductions:Math.round(+$('#i7').value*100)||0}});dlg.close();toast('Saved. Refundable deposit: '+inr(r.deposit_refundable)+'. You can now complete the booking.');show()}catch(x){fail(x)}}}
  else if(t.dataset.rf){const[id,tot]=t.dataset.rf.split(':');const v=prompt('Refund amount in ₹ (max '+Math.round(tot/100)+')',Math.round(tot/100));if(!v)return;await api(`/admin/bookings/${id}/refund`,{method:'POST',body:{amount:Math.round(+v*100)}});toast('Refund recorded.');show()}
  else if(t.dataset.eq){const[id,st]=t.dataset.eq.split(':');await api(`/admin/equipment/${id}`,{method:'PATCH',body:{status:st}});toast('Updated.');show()}
  else if(t.dataset.kyc){const[id,st]=t.dataset.kyc.split(':');await api(`/admin/kyc/${id}`,{method:'POST',body:{status:st}});toast('ID '+st+'.');show()}
  else if(t.id==='add'){const cs=await api('/categories');$('#dm').innerHTML=`<h2>Add equipment</h2><div class="two"><label class="fld">Brand<input id="n1"></label><label class="fld">Name<input id="n2"></label></div><label class="fld">Short specification<input id="n3"></label><div class="two"><label class="fld">Category<select id="n4">${cs.map(c=>`<option value="${c.slug}">${c.name}</option>`).join('')}</select></label><label class="fld">Serial number<input id="n5"></label></div><div class="two"><label class="fld">Price per day (₹)<input id="n6" type="number" min="1"></label><label class="fld">Security deposit (₹)<input id="n7" type="number" min="0"></label></div><p class="err" id="ne"></p><button class="btn p" id="ok">Add to inventory</button>`;dlg.showModal();
   $('#ok').onclick=async()=>{try{await api('/admin/equipment',{method:'POST',body:{brand:$('#n1').value,name:$('#n2').value,short_spec:$('#n3').value,category:$('#n4').value,serial_no:$('#n5').value,price_day:+$('#n6').value,deposit:+$('#n7').value}});dlg.close();toast('Added.');show()}catch(x){$('#ne').textContent=x.message}}}
 }catch(x){fail(x)}});
async function inv(){const e=await api('/admin/equipment');
 $('#p').innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><span style="color:var(--mut)">${e.length} items</span><button class="btn p sm" id="add">Add equipment</button></div><div class="tw"><table class="tbl"><thead><tr><th>Item</th><th>Serial</th><th>Rate / deposit</th><th>Condition</th><th>State</th></tr></thead><tbody>${e.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span style="color:var(--mut)">${esc(x.category_name)}</span></td><td>${esc(x.serial_no||'')}</td><td>${inr(x.price_day)} / ${inr(x.deposit)}</td><td>${esc(x.condition)}</td>
 <td><span class="status ${x.status==='available'?'CONFIRMED':''}">${label(x.status)}</span><div class="acts" style="margin-top:6px">${x.status==='available'?`<button class="btn sm" data-eq="${x.id}:maintenance">Send to maintenance</button>`:x.status!=='archived'?`<button class="btn sm" data-eq="${x.id}:available">Make available</button>`:''}${x.status!=='archived'?`<button class="btn sm" data-eq="${x.id}:archived">Archive</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
async function cu(){const c=await api('/admin/customers');
 $('#p').innerHTML=c.length?`<div class="tw"><table class="tbl"><thead><tr><th>Customer</th><th>Bookings</th><th>ID verification</th></tr></thead><tbody>${c.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span style="color:var(--mut)">${esc(x.email)}</span></td><td>${x.bookings}</td><td>${x.kyc_status?`${label(x.id_type)} ending ${esc(x.id_last4)} · <span class="status ${x.kyc_status==='approved'?'CONFIRMED':x.kyc_status==='rejected'?'CANCELLED':''}">${label(x.kyc_status)}</span>${x.kyc_status==='pending'?`<div class="acts" style="margin-top:6px"><button class="btn p sm" data-kyc="${x.id}:approved">Approve</button><button class="btn sm" data-kyc="${x.id}:rejected">Reject</button></div>`:''}`:'Not added'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>No customers yet</h3><p>Customers appear here after they create an account.</p></div>'}
show();
</script></body></html>
